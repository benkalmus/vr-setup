[general]
; CPU governor used while a game is running under gamemode.
; Restored to the previous governor automatically when the game exits.
; amd-pstate-epp exposes "performance" and "powersave" governors.
desiredgov=performance

; Everything else is left at gamemode defaults:
; - screensaver inhibited while active (inhibit_screensaver=1)
; - no renice/ioprio changes, no core parking/pinning
; GPU settings are handled by LACTd, not by gamemode.
